<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #060713; color: #fff; margin: 0; }
        .login-container { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px; }
        input[type="number"] { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #333; border-radius: 8px; font-size: 20px; letter-spacing: 6px; text-align: center; background: #111; color: #fff; outline: none; }
        button { background: linear-gradient(135deg, #6366F1, #A855F7); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .msg { color: #FF4D4D; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>OTP Verification</h2>
        <p>Sent to: <strong id="phone-txt">...</strong></p>
        
        <div id="error-msg" class="msg"></div>

        <form action="verify-otp.html" method="GET">
            <input type="number" name="otp" placeholder="••••" required oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
            <button type="submit">Verify OTP</button>
        </form>
    </div>

    <script>
        const phone = localStorage.getItem('session_phone');
        if(!phone) {
            window.location.href = "index.html";
        } else {
            document.getElementById('phone-txt').innerText = "+91 " + phone;
        }

        // Check for error msg in URL
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        if(msg) {
            document.getElementById('error-msg').innerText = msg;
        }
    </script>
</body>
</html>
